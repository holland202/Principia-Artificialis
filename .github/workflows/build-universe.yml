name: Build Universe Graph

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build universe graph
        run: python scripts/build_universe_graph.py

      - name: Commit universe.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add universe.html
          git diff --staged --quiet || git commit -m "Auto-build universe graph [skip ci]"
          git push
